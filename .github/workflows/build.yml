name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  MOD_NAME: PortalShapes
  NDK_VERSION: r29

jobs:
  build:
    name: Build & Release (android-arm64-v8a)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Cache xmake dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.xmake
            .xmake
          key: xmake-${{ runner.os }}-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-${{ runner.os }}-

      - name: Ensure zip is available
        run: |
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zip
          fi

      - name: Configure
        run: |
          xmake f -y -p android -a arm64-v8a -m release --ndk="${{ steps.setup-ndk.outputs.ndk-path }}"

      - name: Build
        env:
          NMDK_LIB: ${{ env.NMDK_LIB }}
        run: xmake -y -v

      - name: Package .levipack
        id: locate
        env:
          NMDK_LIB: ${{ env.NMDK_LIB }}
        run: bash scripts/package_levipack.sh "$MOD_NAME" build

      - name: Show release files
        run: |
          echo "Build number: ${{ github.run_number }}"
          echo "SHA: ${{ github.sha }}"
          echo "Release files:"
          ls -lh "${{ steps.locate.outputs.so_file }}"
          ls -lh "${{ steps.locate.outputs.pack_file }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ${{ env.MOD_NAME }} Build ${{ github.run_number }}
          body: |
            Automated build release.

            Build Number: ${{ github.run_number }}
            Commit: ${{ github.sha }}
            Ref: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ steps.locate.outputs.so_file }}
            ${{ steps.locate.outputs.pack_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}